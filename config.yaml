modelo:
  base: Qwen/Qwen3.5-9B-Base
  tokenizador: Qwen/Qwen3.5-9B
  atencion: kernels-community/flash-attn2@v2

lora:
  r: 64
  alpha: 128
  r_compuertas: 16

datos:
  archivos:
    - ../CoT-dataset/salida/dataset.jsonl
    - ../CoT-dataset/salida_prueba2/dataset.jsonl
    - ../CoT-dataset/salida_prueba3/dataset.jsonl
  filtros:
    version_prompts: null
    tipo_tarea: null
    materia: null
  salida: datos_sft
  seq_len: 8192
  fraccion_val: 0.05
  num_proc: 8

entrenamiento:
  epocas: 2
  max_pasos: -1
  acumulacion: 4
  lr: 1.0e-4
  calentamiento: 0.03
  estrategia: steps
  pasos_guardado: 0.05
  checkpoints: 2
  pasos_registro: 1
  max_contenedores_eval: 32
  semilla: 42

monitoreo:
  intervalo_s: 5
  latido_min: 30
  proveedor: RunPod
  precio_hora_gpu: 0.59

evaluacion:
  lotes: lotes_sft
  n_ejemplos: 32
  max_tokens: 8192
  fragmento: 512
  generar: 4
  max_nuevos_tokens: 4096
  benchmarks:
    tareas: [belebele_spa_Latn, xnli_es_spanish_bench, copa_es, openbookqa_es, hellaswag, arc_easy]
    num_fewshot: 0
    batch_size: 4
    limite: 200
