    "transformers[kernels]==5.19.0",
    "kernels==0.17.2",
    "peft==0.21.2",
    "datasets==5.1.0",
    "liger-kernel==0.8.4",
    "flash-linear-attention==0.5.2",
    "causal-conv1d==1.7.0",
